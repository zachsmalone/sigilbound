name: Build Sigilbound battle baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_rom.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'build_rom.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python build_rom.py
      - uses: actions/upload-artifact@v4
        with:
          name: Sigilbound-battle-baseline
          path: output/
          if-no-files-found: error
          retention-days: 14
