name: Build and verify Sigilbound battle baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_rom.py'
      - 'requirements*.txt'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'build_rom.py'
      - 'requirements*.txt'
      - 'tests/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python build_rom.py
      - name: Execute ROM in PyBoy
        run: python tests/smoke_pyboy.py
      - name: Upload successful ROM and verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sigilbound-battle-baseline-verified-in-PyBoy
          path: output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sigilbound-build-failure-diagnostics
          path: output/
          if-no-files-found: warn
          retention-days: 14
